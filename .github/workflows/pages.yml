name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cancel_deployment:
        description: Stale Pages deployment ID to cancel before publishing
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: /ITCS-WEB/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clear a stale Pages deployment
        if: inputs.cancel_deployment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DEPLOYMENT: ${{ inputs.cancel_deployment }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/deployments/$STALE_DEPLOYMENT/cancel"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

